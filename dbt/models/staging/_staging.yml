version: 2

models:
  - name: stg_roll_calls
    columns:
      - name: roll_call_id
        data_tests:
          - unique
          - not_null
      - name: chamber
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["House", "Senate"]
      - name: vote_category
        data_tests:
          - accepted_values:
              arguments:
                values: ["committee", "final_passage", "veto_override", "emergency", "procedural"]

  - name: stg_votes
    columns:
      - name: roll_call_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_roll_calls')
                field: roll_call_id
      - name: people_id
        data_tests:
          - not_null